{% extends "registration/base1.html" %}

{% block title %}Password Changed - MeetHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card text-center">
            <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
            <h2 class="mt-3 mb-2">Password Changed</h2>
            <p class="text-muted">Your password has been updated. You can now sign in.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
