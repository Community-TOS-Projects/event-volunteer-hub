{% extends "registration/base1.html" %}

{% block title %}Check Your Email - MeetHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card text-center">
            <i class="fas fa-envelope text-primary" style="font-size: 3rem; opacity: 0.8;"></i>
            <h2 class="mt-3 mb-2">Check Your Email</h2>
            <p class="text-muted">If an account exists for that email address, we've sent a link to reset your password. It may take a few minutes to arrive.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-3">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
